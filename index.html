<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14202b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Divisor de Ganhos</title>
<style>
:root{--bg:#14202b;--card:#1d2d3b;--line:#2c4154;--tx:#eef3f7;--mut:#8fa5b6;--fuel:#f2a33a;--res:#4fb3d9;--net:#5fd08a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
h1{font-size:20px;margin:6px 0 18px;font-weight:700}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:6px}
.money{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 16px}
.money span{font-size:22px;color:var(--mut);margin-right:8px}
.money input{flex:1;min-width:0;background:none;border:0;color:var(--tx);font-size:34px;font-weight:700;padding:14px 0;outline:none}
.pcts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.pct{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.pct b{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:6px}
.dot{width:10px;height:10px;border-radius:50%}
.pct .in{display:flex;align-items:baseline;gap:4px}
.pct input{width:100%;background:none;border:0;border-bottom:2px solid var(--line);color:var(--tx);font-size:28px;font-weight:700;padding:2px 0;outline:none}
.pct input:focus{border-color:var(--tx)}
.pct .in span{font-size:20px;color:var(--mut)}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line);margin:4px 0 18px}
.bar i{display:block;height:100%;transition:width .25s}
.row{display:flex;justify-content:space-between;align-items:center;padding:16px;background:var(--card);border-radius:14px;border-left:6px solid;margin-bottom:10px}
.row small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.row .n{font-size:16px;font-weight:600}
.row .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.row.net .v{font-size:28px}
.warn{color:#ff8a80;font-size:13px;margin:-6px 0 12px;min-height:16px}
button{width:100%;margin-top:6px;padding:14px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--mut);font-size:15px}
#install{display:none;background:var(--net);color:#0d2316;border:0;font-weight:700;margin-bottom:14px}
</style>
</head>
<body>
<h1>Divisor de Ganhos</h1>
<button id="install">Instalar no celular</button>

<label for="bruto">Valor bruto</label>
<div class="money"><span>R$</span><input id="bruto" type="number" inputmode="decimal" placeholder="0,00" step="0.01"></div>

<div class="pcts">
  <div class="pct"><b><i class="dot" style="background:var(--fuel)"></i>Combustível</b>
    <div class="in"><input id="pf" type="number" inputmode="decimal" step="0.1" min="0" max="100"><span>%</span></div></div>
  <div class="pct"><b><i class="dot" style="background:var(--res)"></i>Reserva do carro</b>
    <div class="in"><input id="pr" type="number" inputmode="decimal" step="0.1" min="0" max="100"><span>%</span></div></div>
</div>

<div class="bar"><i id="bf" style="background:var(--fuel)"></i><i id="br" style="background:var(--res)"></i><i id="bn" style="background:var(--net)"></i></div>
<div class="warn" id="warn"></div>

<div class="row" style="border-color:var(--fuel)"><div><div class="n">Combustível</div><small id="tf"></small></div><div class="v" id="vf">R$ 0,00</div></div>
<div class="row" style="border-color:var(--res)"><div><div class="n">Reserva do carro</div><small id="tr"></small></div><div class="v" id="vr">R$ 0,00</div></div>
<div class="row net" style="border-color:var(--net)"><div><div class="n">Lucro líquido</div><small id="tn"></small></div><div class="v" id="vn">R$ 0,00</div></div>

<button id="reset">Restaurar porcentagens padrão (30% / 10%)</button>

<script>
const $=id=>document.getElementById(id);
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmt=n=>(Math.round(n*10)/10).toString().replace('.',',');
const DEF={f:30,r:10};
let st={f:DEF.f,r:DEF.r,b:''};
try{const s=JSON.parse(localStorage.getItem('divisor')||'null');if(s)st=Object.assign(st,s)}catch(e){}
function save(){try{localStorage.setItem('divisor',JSON.stringify(st))}catch(e){}}
function render(){
  const b=parseFloat(st.b)||0, f=Math.max(0,parseFloat(st.f)||0), r=Math.max(0,parseFloat(st.r)||0);
  const n=100-f-r;
  $('warn').textContent=n<0?'As porcentagens passam de 100%. Reduza combustível ou reserva.':'';
  const nn=Math.max(0,n);
  $('vf').textContent=brl(b*f/100);$('vr').textContent=brl(b*r/100);$('vn').textContent=brl(b*nn/100);
  $('tf').textContent=fmt(f)+'% do bruto';$('tr').textContent=fmt(r)+'% do bruto';$('tn').textContent=fmt(nn)+'% do bruto (o que sobra)';
  const tot=Math.max(100,f+r)||100;
  $('bf').style.width=f/tot*100+'%';$('br').style.width=r/tot*100+'%';$('bn').style.width=nn/tot*100+'%';
}
function load(){$('bruto').value=st.b;$('pf').value=st.f;$('pr').value=st.r;render()}
$('bruto').addEventListener('input',e=>{st.b=e.target.value;save();render()});
$('pf').addEventListener('input',e=>{st.f=e.target.value;save();render()});
$('pr').addEventListener('input',e=>{st.r=e.target.value;save();render()});
$('reset').addEventListener('click',()=>{st.f=DEF.f;st.r=DEF.r;save();load()});
load();

let dp;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('install').style.display='block'});
$('install').addEventListener('click',async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$('install').style.display='none'});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
